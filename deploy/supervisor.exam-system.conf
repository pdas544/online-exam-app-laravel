; Supervisor config for online-exam-system (production).
; Copy to /etc/supervisor/conf.d/exam-system.conf, replace APP_PATH,
; then: supervisorctl reread && supervisorctl update
;
; Cron (install via `crontab -e`, NOT supervisor — schedule:run must exit):
; * * * * * cd APP_PATH && php artisan schedule:run >> /dev/null 2>&1

[program:exam-queue-default]
process_name=%(program_name)s_%(process_num)02d
command=php APP_PATH/artisan queue:work redis --queue=default --sleep=3 --tries=3 --max-time=3600
directory=APP_PATH
autostart=true
autorestart=true
numprocs=2
redirect_stderr=true
stdout_logfile=APP_PATH/storage/logs/queue-default.log

[program:exam-queue-violations]
process_name=%(program_name)s_%(process_num)02d
command=php APP_PATH/artisan queue:work redis --queue=violations --sleep=3 --tries=3 --max-time=3600
directory=APP_PATH
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=APP_PATH/storage/logs/queue-violations.log

[program:exam-reverb]
command=php APP_PATH/artisan reverb:start --port=8080
directory=APP_PATH
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=APP_PATH/storage/logs/reverb.log
